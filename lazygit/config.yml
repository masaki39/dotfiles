# https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md

# czg needs CZ_OPENAI_API_KEY, which is never exported globally; the wrapper in secrets.zsh passes it.
customCommands:
  - command: zsh -c 'source ~/.config/zsh/secrets.zsh && czg ai'
    context: files
    key: c
    output: terminal
  - command: zsh -c 'source ~/.config/zsh/secrets.zsh && czg'
    context: files
    key: C
    output: terminal
gui:
  language: "en"
  showIcons: true
# log customize
git:
  branchLogCmd: "git log --graph --color=always --pretty='%Cred%h%Creset -%C(auto)%d%Creset %s %Cgreen(%cr) %C(bold blue)<%an>%Creset' {{branchName}} --"
  diffRenderers:
    - colorArg: always
      command: delta --dark --paging=never # requires delta to be installed
