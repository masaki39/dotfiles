name: setup

on:
  # Every push to main (no paths filter, so every linked dir is covered) plus a monthly run
  # to catch upstream breakage (runner image, Homebrew, renamed casks)
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 3 1 * *'

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Bash/sh scripts only (zsh is out of scope). claude/hooks/herdr-agent-state.sh is managed by herdr
      - name: Run shellcheck
        run: |
          shellcheck --version
          shellcheck setup.sh scripts/*.sh yazi/install.sh \
            claude/hooks/prefer-rust-tools.sh claude/.devcontainer/init-firewall.sh

  setup:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Run from the same path as on a real machine
      - name: Place repo at ghq path
        run: |
          mkdir -p ~/ghq/github.com/masaki39
          ln -s "$GITHUB_WORKSPACE" ~/ghq/github.com/masaki39/dotfiles

      - name: Run setup.sh
        run: DOTFILES_CI=1 bash ~/ghq/github.com/masaki39/dotfiles/setup.sh

      # setup.sh must be idempotent: a second run on a set-up machine has to succeed too
      - name: Run setup.sh again (idempotency)
        run: DOTFILES_CI=1 bash ~/ghq/github.com/masaki39/dotfiles/setup.sh

      # Same checks an agent runs on a real machine (links, yazi plugins, plists, zsh and nvim startup)
      - name: Verify
        run: bash ~/ghq/github.com/masaki39/dotfiles/scripts/verify.sh
