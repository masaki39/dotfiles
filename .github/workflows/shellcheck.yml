name: shellcheck

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Bash/sh scripts only (zsh is out of scope). claude/hooks/herdr-agent-state.sh is managed by herdr
      - name: Run shellcheck
        run: |
          shellcheck --version
          shellcheck setup.sh scripts/*.sh yazi/install.sh \
            claude/hooks/prefer-rust-tools.sh

