[[mgr.prepend_keymap]]
on = "<Enter>"
run = "plugin smart-enter"

[[mgr.prepend_keymap]]
on = "<C-y>"
run = "plugin system-clipboard"

[[mgr.prepend_keymap]]
on = "<C-p>"
run = "shell 'cb paste' --block"
desc = "Paste from clipboard"

[[mgr.prepend_keymap]]
on = "q"
run = "plugin confirm-quit"

[[mgr.prepend_keymap]]
on = ["s", "s"]
run = 'search --via=fd --args="--no-hidden"'
desc = "Search"

[[mgr.prepend_keymap]]
on = ["s", "d"]
run = 'search --via=fd --args="-t d --no-hidden"'
desc = "Search directories"

[[mgr.prepend_keymap]]
on = ["s", "f"]
run = 'search --via=fd --args="-t f --no-hidden"'
desc = "Search files"

[[mgr.prepend_keymap]]
on = ["s", "z"]
run = "plugin fd-fzf preview"
desc = "Jump to directory"

[[mgr.prepend_keymap]]
on = ["g", "D"]
run = 'shell -- cp -r %s ~/Downloads/'
desc = "Copy to Downloads"

[[mgr.prepend_keymap]]
on = ["g", "e"]
run = 'shell -- ya emit cd "/Volumes"'
desc = "Go to Volumes"

[[mgr.prepend_keymap]]
on = ["g", "p"]
run = 'shell -- ya emit cd "~/pCloud Drive"'
desc = "Go to pCloud"

[[mgr.prepend_keymap]]
on = ["g", "g"]
run = "shell 'lazygit' --block"
desc = "Lazygit"

[[mgr.prepend_keymap]]
on = ["g", "r"]
run = 'shell -- ya emit cd "$(git rev-parse --show-toplevel)"'
desc = "Git Root"

[[mgr.prepend_keymap]]
on = ["g", "v"]
run = "plugin ghq"
desc = "Go ghq repo"

[[mgr.prepend_keymap]]
on = ["g", "f"]
run = "shell 'lazygit -f %h' --block"
desc = "Lazygit file history"

[[mgr.prepend_keymap]]
on = ["c", "r"]
run = "shell --confirm 'git_root=$(git rev-parse --show-toplevel 2>/dev/null) && [ -n \"$git_root\" ] && printf \"%s\" %h | sed \"s|^$git_root/||\" | cb copy'"
desc = "Copy git-relative path"

[[mgr.prepend_keymap]]
on = ["o", "o"]
run = 'shell -- open %h'
desc = "Open with default app"

[[mgr.prepend_keymap]]
on = ["o", "p"]
run = "shell -- qlmanage -p %s"
desc = "Open with Quick Look"

[[mgr.prepend_keymap]]
on = ["o", "m"]
run = "shell 'mo %h' --block"
desc = "Open with mo"

[[mgr.prepend_keymap]]
on = ["o", "n"]
run = "shell 'nvim %h' --block"
desc = "Open with nvim"

[[mgr.prepend_keymap]]
on = ["o", "l"]
run = "plugin ghostty-split right"
desc = "Open terminal split right"

[[mgr.prepend_keymap]]
on = ["o", "j"]
run = "plugin ghostty-split down"
desc = "Open terminal split down"

[[mgr.prepend_keymap]]
on = ["o", "t"]
run = "plugin ghostty-split tab"
desc = "Open terminal new tab"

[[mgr.prepend_keymap]]
on = ["o", "w"]
run = "plugin ghostty-split window"
desc = "Open terminal new window"
