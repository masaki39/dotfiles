[mgr]
show_hidden = true
ratio = [0, 1, 3]

[preview]
max_width = 1920
max_height = 1920

[opener]
edit = [{ run = 'nvim "$@"', block = true, for = "unix" }]
csvlens = [{ run = 'csvlens "$@"', block = true, for = "unix" }]
db-browser = [{ run = 'open -a "DB Browser for SQLite" "$@"', for = "unix" }]

[open]
prepend_rules = [
  { mime = "text/csv", use = "csvlens" },
  { url = "*.db", use = "db-browser" },
]

[plugin]
prepend_previewers = [{ mime = "application/dicom", run = "magick" }]
append_previewers = [
  { mime = "image/tiff", run = "magick" },
  { url = "*.jsonl", run = "json" },
]
prepend_fetchers = [
  { id = "git", group = "file", url = "*", run = "git" },
  { id = "git", group = "directory", url = "*/", run = "git" },
]
