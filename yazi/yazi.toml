[mgr]
show_hidden = true
ratio = [0, 1, 2]

[preview]
max_width = 1920
max_height = 1920

[opener]
edit = [{ run = 'nvim %s', block = true, for = "unix" }]
csvlens = [{ run = 'csvlens %s', block = true, for = "unix" }]

[open]
prepend_rules = [
  { mime = "text/csv", use = "csvlens" },
]

[plugin]
prepend_previewers = [{ mime = "application/dicom", run = "magick" }]
append_previewers = [{ url = "*", run = "quicklook" }]
prepend_fetchers = [
  { id = "git", group = "file", url = "*", run = "git" },
  { id = "git", group = "directory", url = "*/", run = "git" },
]
